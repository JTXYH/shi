<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --paper-top:#FEFEFF; --paper-bottom:#F0F1F3;
    --ink:#1D1D20; --ink-soft:rgba(29,29,32,.60);
    --muted:rgba(29,29,32,.42); --faint:rgba(29,29,32,.32);
    --card-stroke:rgba(0,0,0,.07);
    --accent:#0A84FF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  html,body{background:#cdd3db;}
  body{
    font-family:-apple-system,"PingFang SC","SF Pro Text",sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:40px;
  }
  .win{
    width:488px;height:528px;border-radius:12px;overflow:hidden;position:relative;
    background:linear-gradient(180deg,var(--paper-top),var(--paper-bottom));
    box-shadow:0 30px 80px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);
  }
  .win::before{ /* top radial sheen */
    content:"";position:absolute;left:50%;top:-260px;transform:translateX(-50%);
    width:720px;height:520px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent);
    pointer-events:none;
  }
  .lights{position:absolute;top:16px;left:16px;display:flex;gap:8px;z-index:5;}
  .lights i{width:12px;height:12px;border-radius:50%;display:block;}
  .lights .r{background:#ff5f57;} .lights .y{background:#febc2e;} .lights .g{background:#28c840;}
  .content{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 36px;
  }
  .logo{
    width:60px;height:60px;border-radius:15px;object-fit:cover;
    box-shadow:0 8px 16px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.06);
    border:1px solid rgba(0,0,0,.08);
  }
  .tag{font-size:14px;color:var(--ink-soft);margin-top:18px;}
  .tiles{display:flex;gap:12px;margin-top:30px;}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:default;}
  .card{
    width:118px;height:76px;border-radius:14px;background:#fff;position:relative;
    border:1px solid var(--card-stroke);box-shadow:0 2px 6px rgba(0,0,0,.05);
    display:flex;align-items:center;justify-content:center;
  }
  .card.sel{border:2px solid var(--accent);box-shadow:0 4px 12px rgba(10,132,255,.20);}
  .prev{position:absolute;inset:6px;border-radius:9px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  .prev.wipe{background:#12141A;}
  .prev.wipe::after{content:"";position:absolute;width:150px;height:60px;
    left:-10px;top:0;transform:rotate(32deg);
    background:radial-gradient(closest-side,rgba(210,225,245,.35),transparent);}
  .prev.white{background:linear-gradient(135deg,#fff,#E6E4E0);}
  .prev.white::after{content:"";position:absolute;width:80px;height:80px;left:18px;top:6px;
    background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent);}
  .prev.night{background:#0C0E13;color:rgba(255,255,255,.9);
    font-size:13px;font-weight:200;letter-spacing:1px;font-variant-numeric:tabular-nums;}
  .badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:1.5px solid #fff;color:#fff;font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center;}
  .label{font-size:12.5px;color:var(--muted);}
  .label.sel{color:var(--ink);font-weight:600;}
  .btn{
    margin-top:30px;width:208px;height:46px;border-radius:23px;color:#fff;
    font-size:15px;font-weight:600;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#3898FF,#0070F2);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 14px 30px rgba(10,132,255,.32);
  }
  .exit{font-size:12px;color:var(--faint);margin-top:16px;}
</style>
</head>
<body>
  <div class="win">
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="content">
      <img class="logo" src="applogo.png" alt="拭" />
      <div class="tag">挡住键盘，擦干净再回来</div>
      <div class="tiles">
        <div class="tile">
          <div class="card sel"><div class="prev wipe"></div><div class="badge">✓</div></div>
          <div class="label sel">拭镜</div>
        </div>
        <div class="tile">
          <div class="card"><div class="prev white"></div></div>
          <div class="label">白屏</div>
        </div>
        <div class="tile">
          <div class="card"><div class="prev night">15:50</div></div>
          <div class="label">夜钟</div>
        </div>
      </div>
      <div class="btn">开始清洁</div>
      <div class="exit">两个 Shift 按住退出</div>
    </div>
  </div>
</body>
</html>
