<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拭 · 清洁模式</title>
  <style>
    :root {
      --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --hold: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0d10;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Idle desktop: a quiet Mac, not a fake screenshot */
    .idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1200px 700px at 18% 0%, oklch(0.32 0.04 230 / .55), transparent 55%),
        radial-gradient(900px 600px at 88% 110%, oklch(0.28 0.05 40 / .4), transparent 50%),
        linear-gradient(180deg, oklch(0.22 0.03 240), oklch(0.12 0.02 250));
    }

    .menubar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: oklch(0.96 0.01 230 / .88);
      font-size: 13px;
      letter-spacing: 0.01em;
      background: oklch(0.18 0.02 240 / .35);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid oklch(1 0 0 / .06);
    }

    .menubar-left { font-weight: 600; }
    .menubar-right {
      display: flex;
      align-items: center;
      gap: 18px;
      font-variant-numeric: tabular-nums;
    }

    .shi-mark {
      font-weight: 500;
      letter-spacing: 0.18em;
      padding: 2px 2px 2px 0.18em;
      opacity: 0.92;
    }
    .shi-mark:hover { opacity: 1; }
    .shi-mark:active { transform: scale(0.98); }

    .idle-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      color: oklch(0.93 0.01 230);
    }

    .idle-title {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      line-height: 1.1;
    }

    .idle-sub {
      font-size: 14px;
      opacity: 0.5;
      max-width: 28ch;
      text-align: center;
      line-height: 1.6;
    }

    .skins {
      display: flex;
      gap: 28px;
      margin-top: 8px;
    }

    .skin-btn {
      font-size: 13px;
      letter-spacing: 0.14em;
      padding: 8px 2px 10px 0.14em;
      opacity: 0.4;
      border-bottom: 1px solid transparent;
    }
    .skin-btn[aria-pressed="true"] {
      opacity: 0.92;
      border-bottom-color: oklch(0.93 0.01 230 / .7);
    }
    .skin-btn:hover { opacity: 0.8; }

    .reenter {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      padding: 10px 22px 10px calc(22px + 0.12em);
      color: oklch(0.14 0.01 250);
      background: oklch(0.93 0.01 230);
      border-radius: 999px;
    }
    .reenter:hover { filter: brightness(1.06); }
    .reenter:active { transform: scale(0.98); }

    .idle-foot {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: oklch(0.93 0.01 230 / .38);
    }

    /* Cleaning overlay */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      opacity: 1;
      transition: opacity 0.7s var(--ease-out);
    }
    .overlay.is-exiting { opacity: 0; pointer-events: none; }
    .overlay[data-skin="wipe"],
    .overlay[data-skin="night"] { color: oklch(0.93 0.01 230); }
    .overlay[data-skin="wipe"] { background: oklch(0.145 0.012 250); }
    .overlay[data-skin="white"] {
      background: oklch(0.955 0.007 95);
      color: oklch(0.28 0.02 250);
    }
    .overlay[data-skin="night"] { background: oklch(0.11 0.01 260); }

    .fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, oklch(0 0 0 / .38) 100%);
    }
    .overlay[data-skin="white"] .vignette {
      background: radial-gradient(ellipse at center, transparent 50%, oklch(0.72 0.02 80 / .28) 100%);
    }

    .sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, oklch(1 0 0 / .055), transparent 22%);
    }
    .overlay[data-skin="white"] .sheen {
      background: linear-gradient(to bottom, oklch(1 0 0 / .5), transparent 18%);
    }

    .grain {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
      pointer-events: none;
      opacity: 0.045;
      mix-blend-mode: overlay;
    }
    .overlay[data-skin="white"] .grain { opacity: 0.028; mix-blend-mode: multiply; }

    .copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: oklch(0.93 0.01 230);
    }
    .overlay[data-skin="white"] .copy { color: oklch(0.28 0.02 250); }

    .status {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      opacity: 0.62;
      margin-bottom: 14px;
      line-height: 1.2;
    }
    .overlay[data-skin="night"] .status { opacity: 0.4; }

    .elapsed {
      font-size: 64px;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      line-height: 1.1;
      padding-bottom: 4px;
    }
    .overlay[data-skin="night"] .elapsed { font-size: 72px; font-weight: 200; }

    .teach {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s var(--ease-out);
    }
    .teach.is-on { opacity: 1; }
    .teach-line {
      font-size: 13px;
      letter-spacing: 0.14em;
      padding-left: 0.14em;
      opacity: 0.62;
      white-space: nowrap;
    }

    .hint {
      position: absolute;
      bottom: 56px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: none;
      color: inherit;
    }

    .ring {
      width: 36px;
      height: 36px;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.25s ease, transform 0.25s var(--ease-out);
    }
    .hint.is-holding .ring {
      opacity: 1;
      transform: scale(1);
    }

    .ring-svg { width: 36px; height: 36px; display: block; }
    .ring-track { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: 0.18; }
    .ring-val {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      transform-origin: 18px 18px;
      transform: rotate(-90deg);
      stroke-dasharray: 100.53;
      stroke-dashoffset: calc(100.53 * (1 - var(--hold)));
    }

    .hint-text {
      font-size: 12px;
      letter-spacing: 0.16em;
      padding-left: 0.16em;
      opacity: 0.5;
      transition: opacity 0.25s ease;
    }
    .hint.is-holding .hint-text { opacity: 0.92; }
    .overlay[data-skin="white"] .hint-text { opacity: 0.48; }
    .overlay[data-skin="white"] .hint.is-holding .hint-text { opacity: 0.82; }

    .blur-focus {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.12em;
      padding: 8px 14px 8px calc(14px + 0.12em);
      border-radius: 999px;
      background: oklch(0.2 0.01 250 / .55);
      color: oklch(0.95 0.01 230 / .8);
      backdrop-filter: blur(12px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .blur-focus.is-on { opacity: 1; cursor: auto; pointer-events: none; }
    .overlay[data-skin="white"] .blur-focus {
      background: oklch(1 0 0 / .55);
      color: oklch(0.28 0.02 250 / .8);
    }

    @media (prefers-reduced-motion: reduce) {
      .overlay { transition: none; }
      .teach { transition: none; }
    }
  </style>
</head>
<body>
  <!--
    Design read: Mac cleaning overlay for the person wiping a keyboard and display.
    Centered lock-screen, not a marketing hero. Motion is a microfiber pad on glass.
    Skins: 拭镜 (ritual dark wipe), 白屏 (inspect real smudges, no fake dust), 夜钟 (clock only).
    Dual Shift hold 1.5s exits. Shift+Esc is the one-handed fallback.
  -->
  <div id="root"></div>
  <svg class="grain-src" width="0" height="0" aria-hidden="true" style="position:absolute">
    <filter id="grainFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"></feTurbulence>
    </filter>
  </svg>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel">
    const { useEffect, useRef, useState, useCallback } = React;

    const HOLD_MS = 1500;
    const SKINS = [
      { id: "wipe", label: "拭镜" },
      { id: "white", label: "白屏" },
      { id: "night", label: "夜钟" }
    ];

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatElapsed(ms) {
      const s = Math.floor(ms / 1000);
      return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    }

    function smoothstep(t) {
      const x = Math.min(1, Math.max(0, t));
      return x * x * (3 - 2 * x);
    }

    function clothT(seconds) {
      const cycle = 28;
      const u = ((seconds + 9) / cycle) % 1;
      const wait = 0.07;
      if (u < wait) return 0;
      if (u > 1 - wait) return 1;
      return smoothstep((u - wait) / (1 - 2 * wait));
    }

    function makeParticles(w, h, n) {
      const list = [];
      for (let i = 0; i < n; i++) {
        list.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.35 + Math.random() * 1.15,
          a: 0.03 + Math.random() * 0.14,
          tw: Math.random() * Math.PI * 2,
          sp: 0.12 + Math.random() * 0.35
        });
      }
      return list;
    }

    function drawAtmosphere(ctx, w, h, skin, seconds, reduce) {
      const t = clothT(seconds);
      const cx = -w * 0.12 + t * w * 1.24;
      const cy = -h * 0.08 + t * h * 1.16;

      if (skin === "night") {
        const breath = 0.5 + 0.5 * Math.sin(seconds * Math.PI * 2 / 8);
        const g = ctx.createRadialGradient(w * 0.5, h * 0.46, 0, w * 0.5, h * 0.5, h * 0.55);
        g.addColorStop(0, "rgba(210, 224, 245," + (0.025 + breath * 0.035) + ")");
        g.addColorStop(0.55, "rgba(160, 180, 210, 0.02)");
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        return { cx, cy, active: false };
      }

      if (reduce) return { cx, cy, active: false };

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 5.1);
      ctx.scale(1.85, 0.52);
      const radius = Math.max(w, h) * 0.38;
      const pad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
      if (skin === "white") {
        pad.addColorStop(0, "rgba(40, 42, 48, 0.07)");
        pad.addColorStop(0.35, "rgba(60, 58, 52, 0.03)");
        pad.addColorStop(1, "transparent");
      } else {
        pad.addColorStop(0, "rgba(255, 255, 255, 0.22)");
        pad.addColorStop(0.22, "rgba(214, 228, 245, 0.09)");
        pad.addColorStop(0.55, "rgba(170, 198, 230, 0.03)");
        pad.addColorStop(1, "transparent");
      }
      ctx.fillStyle = pad;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (skin !== "white") {
        const spec = ctx.createRadialGradient(cx - 28, cy - 22, 0, cx, cy, Math.max(w, h) * 0.1);
        spec.addColorStop(0, "rgba(255, 252, 245, 0.28)");
        spec.addColorStop(0.45, "rgba(255, 255, 255, 0.07)");
        spec.addColorStop(1, "transparent");
        ctx.fillStyle = spec;
        ctx.fillRect(0, 0, w, h);
      }

      return { cx, cy, active: true };
    }

    function Overlay({ skin, onExit }) {
      const canvasRef = useRef(null);
      const timeRef = useRef(null);
      const hintRef = useRef(null);
      const focusRef = useRef(null);
      const teachRef = useRef(null);
      const overlayRef = useRef(null);
      const [exiting, setExiting] = useState(false);
      const [teachOn, setTeachOn] = useState(true);

      useEffect(() => {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext("2d", { alpha: true });
        let particles = [];
        let raf = 0;
        let running = true;
        const sessionStart = performance.now();
        const held = new Set();
        let holdMs = 0;
        let last = performance.now();

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (skin === "wipe") particles = makeParticles(w, h, Math.round((w * h) / 28000));
        }

        function setHold(p) {
          const node = overlayRef.current;
          if (node) node.style.setProperty("--hold", String(p));
          if (hintRef.current) hintRef.current.classList.toggle("is-holding", p > 0.01);
        }

        function tick(now) {
          if (!running) return;
          const dt = Math.min(40, now - last);
          last = now;
          const elapsed = now - sessionStart;
          const seconds = elapsed / 1000;
          if (timeRef.current) timeRef.current.textContent = formatElapsed(elapsed);

          const w = window.innerWidth;
          const h = window.innerHeight;
          ctx.clearRect(0, 0, w, h);
          const cloth = drawAtmosphere(ctx, w, h, skin, seconds, reduce);

          if (skin === "wipe" && !reduce) {
            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              p.tw += dt * 0.0008 * p.sp;
              p.y += Math.sin(p.tw) * 0.015;
              if (cloth.active) {
                const dx = p.x - cloth.cx;
                const dy = p.y - cloth.cy;
                const dist = Math.hypot(dx, dy);
                const reach = Math.max(w, h) * 0.22;
                if (dist < reach) {
                  const f = 1 - dist / reach;
                  p.x += 0.55 * f;
                  p.y += 0.32 * f;
                  p.a *= 1 - f * 0.045;
                }
              }
              if (p.a < 0.012) {
                p.x = Math.random() * w;
                p.y = Math.random() * h;
                p.a = 0.02 + Math.random() * 0.1;
              }
              ctx.beginPath();
              ctx.fillStyle = "rgba(230, 236, 245," + p.a + ")";
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          const both = held.has("ShiftLeft") && held.has("ShiftRight");
          const fallback = (held.has("ShiftLeft") || held.has("ShiftRight")) && held.has("Escape");
          if (both || fallback) {
            holdMs += dt;
            setHold(Math.min(1, holdMs / HOLD_MS));
            if (holdMs >= HOLD_MS) {
              running = false;
              setHold(1);
              setExiting(true);
              window.setTimeout(onExit, 680);
              return;
            }
          } else if (holdMs > 0) {
            holdMs = 0;
            setHold(0);
          }

          raf = requestAnimationFrame(tick);
        }

        function onKeyDown(e) {
          e.preventDefault();
          e.stopPropagation();
          if (e.repeat) return;
          held.add(e.code);
        }
        function onKeyUp(e) {
          e.preventDefault();
          held.delete(e.code);
        }
        function onBlur() {
          held.clear();
          holdMs = 0;
          setHold(0);
          if (focusRef.current) focusRef.current.classList.add("is-on");
        }
        function onFocus() {
          if (focusRef.current) focusRef.current.classList.remove("is-on");
        }

        resize();
        if (overlayRef.current) overlayRef.current.focus();
        window.addEventListener("resize", resize);
        window.addEventListener("keydown", onKeyDown, true);
        window.addEventListener("keyup", onKeyUp, true);
        window.addEventListener("blur", onBlur);
        window.addEventListener("focus", onFocus);
        raf = requestAnimationFrame(tick);

        const teachTimer = window.setTimeout(function () {
          setTeachOn(false);
        }, 4800);

        return function () {
          running = false;
          cancelAnimationFrame(raf);
          window.clearTimeout(teachTimer);
          window.removeEventListener("resize", resize);
          window.removeEventListener("keydown", onKeyDown, true);
          window.removeEventListener("keyup", onKeyUp, true);
          window.removeEventListener("blur", onBlur);
          window.removeEventListener("focus", onFocus);
        };
      }, [skin, onExit]);

      return (
        <div
          ref={overlayRef}
          className={"overlay" + (exiting ? " is-exiting" : "")}
          data-skin={skin}
          data-screen-label="清洁模式"
          tabIndex={0}
          onMouseDown={function () { window.focus(); }}
        >
          <canvas ref={canvasRef} className="fx"></canvas>
          <div className="vignette"></div>
          <div className="sheen"></div>
          <svg className="grain" aria-hidden="true">
            <rect width="100%" height="100%" filter="url(#grainFilter)"></rect>
          </svg>
          <div className={"teach" + (teachOn ? " is-on" : "")} ref={teachRef}>
            <p className="teach-line">输入已暂停，可以擦键盘和屏幕</p>
          </div>
          <div className="copy">
            <p className="status">清洁中</p>
            <p className="elapsed" ref={timeRef}>00:00</p>
          </div>
          <div className="hint" ref={hintRef}>
            <div className="ring" aria-hidden="true">
              <svg className="ring-svg" viewBox="0 0 36 36">
                <circle className="ring-track" cx="18" cy="18" r="16"></circle>
                <circle className="ring-val" cx="18" cy="18" r="16"></circle>
              </svg>
            </div>
            <p className="hint-text">同时按住两个 Shift 退出</p>
          </div>
          <div className="blur-focus" ref={focusRef}>点一下屏幕，再按住两个 Shift</div>
        </div>
      );
    }

    function Idle({ skin, onSkin, onEnter, clock }) {
      return (
        <div className="idle" data-screen-label="桌面">
          <div className="menubar">
            <span className="menubar-left">拭</span>
            <div className="menubar-right">
              <span>{clock}</span>
              <button className="shi-mark" type="button" onClick={onEnter}>拭</button>
            </div>
          </div>
          <div className="idle-body">
            <h1 className="idle-title">已退出</h1>
            <p className="idle-sub">选一种画面，再点菜单栏右侧的「拭」，或直接再次进入。</p>
            <div className="skins" role="tablist" aria-label="画面">
              {SKINS.map(function (item) {
                return (
                  <button
                    key={item.id}
                    className="skin-btn"
                    type="button"
                    role="tab"
                    aria-pressed={skin === item.id}
                    onClick={function () { onSkin(item.id); }}
                  >
                    {item.label}
                  </button>
                );
              })}
            </div>
            <button className="reenter" type="button" onClick={onEnter}>再次进入</button>
          </div>
          <p className="idle-foot">左右 Shift 按住 1.5 秒退出，Shift + Esc 也可以</p>
        </div>
      );
    }

    function App() {
      const boot = new URLSearchParams(window.location.search);
      const bootSkin = SKINS.some(function (s) { return s.id === boot.get("skin"); }) ? boot.get("skin") : "wipe";
      const [phase, setPhase] = useState(boot.get("phase") === "idle" ? "idle" : "clean");
      const [skin, setSkin] = useState(bootSkin);
      const [clock, setClock] = useState("");

      useEffect(function () {
        function stamp() {
          const d = new Date();
          setClock(pad(d.getHours()) + ":" + pad(d.getMinutes()));
        }
        stamp();
        const id = window.setInterval(stamp, 10000);
        return function () { window.clearInterval(id); };
      }, []);

      useEffect(function () {
        function blockContext(e) { e.preventDefault(); }
        document.addEventListener("contextmenu", blockContext);
        document.body.style.overflow = "hidden";
        return function () {
          document.removeEventListener("contextmenu", blockContext);
        };
      }, []);

      const exit = useCallback(function () {
        setPhase("idle");
      }, []);

      const enter = useCallback(function () {
        setPhase("clean");
      }, []);

      return (
        <div className="stage">
          {phase === "idle" ? (
            <Idle skin={skin} onSkin={setSkin} onEnter={enter} clock={clock} />
          ) : (
            <Overlay key={skin + "-run"} skin={skin} onExit={exit} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
